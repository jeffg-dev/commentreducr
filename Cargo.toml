[package]
name = "commentreducr"
version = "0.9.0"
edition = "2024"
license = "Apache-2.0"
description = "Strip low-value comments and docstrings from a JS/TS/Python/YAML codebase, keeping structural ones"
repository = "https://github.com/jeffg-dev/commentreducr"
readme = "README.md"
keywords = ["comments", "cli", "tree-sitter", "refactoring", "docstrings"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["tools/", "assets/", "DESIGN.md"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
regex = "1.13.1"
minreq = { version = "3.0.0", features = ["https-rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tree-sitter = "0.27.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"

