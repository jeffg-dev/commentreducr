[package]
name = "commentreducr"
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
description = "Strip low-value comments from a JS/TS/Python codebase, keeping structural ones"
repository = "https://github.com/jeffg-dev/commentreducr"
readme = "README.md"
keywords = ["comments", "cli", "tree-sitter", "refactoring"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["tools/", "assets/", "DESIGN.md"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
regex = "1.13.1"
minreq = { version = "3.0.0", features = ["https-rustls", "json-using-serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.5"
tree-sitter = "0.27.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-typescript = "0.23.2"
unicode-segmentation = "1.13.3"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
